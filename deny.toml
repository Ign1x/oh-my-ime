# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Unmaintained transitive crates of Slint 1.16 (Sparkle, Rime, omime-panel,
# omime-overlay, omime-settings and their build macros). zvariant 5 and its derive
# macro also reach omimed through gvdb 0.10. The [bans] wrappers constrain the Slint
# and zbus:<6 entry points and selected direct parents, not every transitive crate.
ignore = [
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser, via Slint in the UI programs" },
  { id = "RUSTSEC-2026-0206", reason = "rustybuzz, via Slint in the UI programs" },
  { id = "RUSTSEC-2026-0370", reason = "zvariant 5, via Slint's zbus 5 in the UI programs and gvdb in omimed" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names 4, via Slint's zbus 5 in the UI programs" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive 5, via Slint's zbus 5 in the UI programs and gvdb in omimed" },
  { id = "RUSTSEC-2026-0441", reason = "pin-utils is used only by spin_on in Slint's build-time macros; spin_on 0.1.1 has no newer release. This advisory records maintenance status, not a reported vulnerability. Remove when Slint replaces this dependency." },
]

[licenses]
version = 2
confidence-threshold = 0.9
# The list is a policy, not an inventory.
unused-allowed-license = "allow"
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "BSL-1.0",
  "CC0-1.0",
]

# Slint is licensed GPL-3.0 OR royalty-free OR commercial. The user interface programs
# (the Sparkle demo engine, the Rime engine, the switcher and its overlay library, the
# settings) use it
# under the royalty-free license (attribution in the README); the daemon, the command
# line tool, the protocol crate and the SDK may not depend on it (see [bans]). The
# settings' tests also use Slint's testing backend.
exceptions = [
  { crate = "slint", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
  { crate = "slint-macros", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
  { crate = "i-slint-backend-testing", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
  { crate = "i-slint-backend-selector", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
  { crate = "i-slint-backend-winit", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
  { crate = "i-slint-common", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
  { crate = "i-slint-compiler", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
  { crate = "i-slint-core", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
  { crate = "i-slint-core-macros", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
  { crate = "i-slint-renderer-femtovg", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
  { crate = "i-slint-renderer-skia", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
  { crate = "i-slint-renderer-software", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
  # Only user interface programs may use Slint; omimed, omime, omime-proto and the SDK
  # stay MIT/Apache-2.0 only.
  { crate = "slint", wrappers = ["omime-sparkle", "omime-overlay", "omime-panel", "omime-settings", "omime-rime"] },
  { crate = "i-slint-backend-testing", wrappers = ["omime-settings"] },
  # The platform uses zbus 6; the old zbus only comes with Slint.
  { crate = "zbus:<6", wrappers = ["i-slint-backend-winit"] },
  { crate = "ttf-parser", wrappers = ["fontdb", "owned_ttf_parser", "rustybuzz", "usvg"] },
  { crate = "rustybuzz", wrappers = ["usvg"] },
  { crate = "pin-utils", wrappers = ["spin_on"] },
  { crate = "spin_on", wrappers = ["slint-macros"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
