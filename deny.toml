# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Unmaintained crates that only the Sparkle demo engine pulls in, through Slint 1.16
# (the newest Slint release for our MSRV). [bans] below keeps them out of the platform.
ignore = [
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser, via Slint (demo engine only)" },
  { id = "RUSTSEC-2026-0206", reason = "rustybuzz, via Slint (demo engine only)" },
  { id = "RUSTSEC-2026-0370", reason = "zvariant 5, via Slint's zbus 5 (demo engine only)" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names 4, via Slint's zbus 5 (demo engine only)" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive 5, via Slint's zbus 5 (demo engine only)" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# The list is a policy, not an inventory.
unused-allowed-license = "allow"
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "BSL-1.0",
  "CC0-1.0",
]

# Slint is licensed GPL-3.0 OR royalty-free OR commercial. The Sparkle demo engine uses
# it under the royalty-free license (attribution in the README); nothing else may
# depend on it (see [bans]).
exceptions = [
  { crate = "slint", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
  { crate = "slint-macros", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
  { crate = "i-slint-backend-selector", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
  { crate = "i-slint-backend-winit", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
  { crate = "i-slint-common", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
  { crate = "i-slint-compiler", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
  { crate = "i-slint-core", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
  { crate = "i-slint-core-macros", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
  { crate = "i-slint-renderer-femtovg", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
  { crate = "i-slint-renderer-skia", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
  { crate = "i-slint-renderer-software", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
  # Only the demo engine may use Slint; the platform and SDK stay MIT/Apache-2.0.
  { crate = "slint", wrappers = ["omime-sparkle"] },
  # The platform uses zbus 6; the old zbus only comes with Slint.
  { crate = "zbus:<6", wrappers = ["i-slint-backend-winit"] },
  { crate = "rustybuzz", wrappers = ["usvg"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
