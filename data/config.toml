# oh-my-ime configuration: ~/.config/oh-my-ime/config.toml
# Run `omime reload` after editing; it says what is wrong if anything is, and omimed
# keeps the configuration it had then.

# Enabled engines and input methods, in switching order. An engine such as "fcitx5"
# brings every input method it has; "fcitx5/shuangpin" is one input method inside it,
# which omimed adds to Fcitx 5's group when you switch to it. Without this line every
# installed engine is enabled, except Fcitx 5 and IBus, which are only offered.
# `omime enable <id>` and `omime disable <id>` edit it for you.
# engines = ["fcitx5/shuangpin", "sparkle", "echo"]

# The first login's input method, before a saved choice exists. It must be enabled.
# Later logins restore your last choice, including direct input. `omime setup
# --engine ID` configures this and enables the method; `omime switch ID` switches now.
# initial_input_method = "fcitx5/shuangpin"

[hotkeys]
# Switch between direct input and the last used engine. Empty disables it.
toggle = "Control+space"
# Switch to the next enabled engine. Empty disables it.
next = "Control+Shift+space"

[engine]
# How long to wait for an engine to answer a key before passing the key through.
key_timeout_ms = 200

[apps]
# Give each application the engine you last used in it, instead of one engine for all
# of them. Applications you have not switched in keep the current engine. Needs a
# compositor that tells clients which window has focus (Hyprland, sway and other
# compositors with wlr-foreign-toplevel-management).
remember = false

[tray]
# Show the current engine in the tray of status bars (StatusNotifierItem), with a menu
# to switch.
enabled = true

[panel]
# Show the input methods for a moment, at the bottom of the screen, when you switch
# with the hotkeys or `omime switch`/`next`/`toggle` (the switcher, omime-panel).
enabled = true

[notifications]
# Tell you with a desktop notification when something goes wrong: an engine stopped,
# another input method holds a seat, or this file has a mistake.
enabled = true
