# Fcitx 5, unmodified, hosted by omimed as one engine with all its input methods and
# addons. Offered once fcitx5 is installed (it must not run on its own); enable it with
# `omime enable fcitx5`. See docs/hyprland.md.
[engine]
id = "fcitx5"
name = "Fcitx 5"
description = "Fcitx 5 with all its input methods and addons, hosted as one engine."
exec = ["fcitx5"]
protocol = "input-method-v2"
requires = ["fcitx5"]
enabled_by_default = false

# Fcitx 5's configuration tool talks to it on its private bus.
[engine.settings]
exec = ["fcitx5-configtool"]
bus = "engine"

[engine.i18n.zh-CN]
name = "Fcitx 5"
description = "把 Fcitx 5 连同它的全部输入法和插件作为一个引擎托管。"
