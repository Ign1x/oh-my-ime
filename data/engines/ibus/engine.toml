# IBus, unmodified, hosted by omimed as one engine with all its engines (ibus-libpinyin,
# ibus-rime, ...). omime-ibus starts ibus-daemon and IBus's GTK panel as the Wayland input
# method. Offered once IBus (1.5.32 or later) is installed (it must not run on its own);
# enable it with `omime enable ibus`. See docs/hyprland.md.
[engine]
id = "ibus"
name = "IBus"
description = "IBus with all its engines, hosted as one engine."
exec = ["omime-ibus"]
protocol = "input-method-v2"
requires = ["ibus-daemon"]
enabled_by_default = false

# ibus-setup saves to dconf on the user's bus, which the hosted IBus reads only when it
# starts: it is restarted when ibus-setup closes.
[engine.settings]
exec = ["ibus-setup"]
restart = true

[engine.i18n.zh-CN]
name = "IBus"
description = "把 IBus 连同它的全部输入法作为一个引擎托管。"
