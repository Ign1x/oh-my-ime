name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libwayland-dev libxkbcommon-dev libdbus-1-dev libfontconfig-dev librime-dev xkb-data
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: python3 scripts/check-translations.py
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked

  e2e:
    name: end-to-end (headless sway)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build and run the end-to-end tests
        # -o pipefail: tee must not hide a failure.
        shell: bash
        run: |
          nix develop .#e2e --command bash -c \
            'cargo build --workspace --locked && cargo test -p omime-e2e --locked --no-fail-fast -- --ignored' \
            2>&1 | tee e2e.log
      - name: Annotate failed end-to-end tests
        if: failure()
        run: scripts/ci-annotate-e2e.sh e2e.log

  nix:
    name: Nix package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build the package (runs the unit tests)
        run: nix build --print-build-logs
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Run the end-to-end tests against the package
        # -o pipefail: tee must not hide a failure.
        shell: bash
        run: |
          nix develop .#e2e --command bash -c \
            'cargo build -p omime-e2e --locked && OMIME_E2E_INSTALL_DIR=$(readlink -f result)/bin cargo test -p omime-e2e --locked --no-fail-fast -- --ignored' \
            2>&1 | tee e2e.log
      - name: Annotate failed end-to-end tests
        if: failure()
        run: scripts/ci-annotate-e2e.sh e2e.log

  deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
