[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
authors = ["ign1x <ign1x@ign1x.com>"]
repository = "https://github.com/Ign1x/oh-my-ime"
homepage = "https://github.com/Ign1x/oh-my-ime"

[workspace.dependencies]
omime-proto = { path = "crates/omime-proto" }

[workspace.lints.rust]
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
undocumented_unsafe_blocks = "warn"

[profile.release]
lto = "thin"
codegen-units = 4
