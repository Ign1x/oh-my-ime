[workspace]
resolver = "3"
members = ["crates/*", "engines/*", "tests/e2e"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
authors = ["ign1x <ign1x@ign1x.com>"]
repository = "https://github.com/Ign1x/oh-my-ime"
homepage = "https://github.com/Ign1x/oh-my-ime"

[workspace.dependencies]
omime-proto = { path = "crates/omime-proto", version = "0.1.0" }
omime-sdk = { path = "crates/omime-sdk", version = "0.1.0" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
toml_edit = "0.23"
# Members enable what they need; `omime-proto` only uses the wire types.
zbus = { version = "6.1", default-features = false }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi", "tracing-log"] }
tokio = { version = "1.47", features = ["rt", "net", "time", "macros", "signal", "sync", "io-util"] }
rustix = { version = "1", features = ["fs", "process", "net", "pipe", "time", "event"] }
xkbcommon = { version = "0.9", default-features = false }
wl-proxy = { version = "=0.1.5", default-features = false, features = ["logging"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[workspace.lints.rust]
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
undocumented_unsafe_blocks = "warn"

[profile.release]
lto = "thin"
codegen-units = 4
