[package]
name = "omime-cli"
description = "omime: command line tool to manage the oh-my-ime input method platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "omime"
path = "src/main.rs"

[dependencies]
omime-proto.workspace = true
anyhow.workspace = true
futures-core = "0.3"
toml_edit.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }
zbus = { workspace = true, features = ["tokio", "p2p", "proxy", "service"] }

[lints]
workspace = true
