[package]
name = "omime-settings"
description = "The settings of oh-my-ime: input methods, hotkeys, applications and options, through omimed's control API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
omime-proto.workspace = true
anyhow.workspace = true
futures-util = { version = "0.3", default-features = false }
tokio = { workspace = true, features = ["rt"] }
tracing.workspace = true
tracing-subscriber.workspace = true
xkbcommon.workspace = true
zbus = { workspace = true, features = ["tokio", "proxy"] }
# Under Slint's royalty-free license, as Sparkle. The software renderer works
# everywhere; femtovg uses the GPU when available.
slint = { version = "1.16", default-features = false, features = [
  "std",
  "compat-1-2",
  "backend-winit-wayland",
  "renderer-femtovg",
  "renderer-software",
] }

[dev-dependencies]
# Runs the user interface without a display in the tests; the version of slint.
i-slint-backend-testing = "~1.16"

[lints]
workspace = true
